# Produção: Caddy (HTTPS) → web (Next) → api (NestJS + SQLite).
# Só o Caddy publica portas. A API e o Next ficam na rede interna.
# Antes de subir: cp .env.example .env e preencha. Depois: docker compose up -d --build

services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:?Defina ADMIN_SENHA no .env}
      APP_TZ: ${APP_TZ:-America/Sao_Paulo}
    volumes:
      - dados:/data

  web:
    build:
      context: .
      target: web
      args:
        API_URL: http://api:8080
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  # Banco SQLite. Uma única instância da API (as sessões de votação ficam em memória).
  dados:
  caddy_dados:
  caddy_config:
