# Segundo bloco: cole depois de emitir o certificado; sem ele o nginx não inicia.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mc.riversoftware.tech;

  ssl_certificate     /etc/letsencrypt/live/mc.riversoftware.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mc.riversoftware.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    # Com variável o nome é resolvido a cada requisição: se o Makários estiver
    # fora do ar, o nginx continua de pé e o River não é afetado.
    set $upstream_makarios makarios-web:3002;
    proxy_pass http://$upstream_makarios$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
